[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinymedvision"
version = "0.1.0"
description = "Reproducible benchmarks for compact medical image classifiers"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["torch>=2.2", "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.3", "matplotlib>=3.8", "Pillow>=10"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Topic :: Scientific/Engineering :: Medical Science Apps."]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tinymedvision = "tinymedvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
